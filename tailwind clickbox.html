<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Tailwind States Example</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="flex items-center justify-center min-h-screen bg-brown-100">

    <div class="space-y-4">

        <!-- Button Example -->
        <button class="
        bg-green-500
        hover:bg-green-700
        active:bg-green-800
        focus:ring-4
        focus:ring-green-300
        text-white
        px-6 py-2
        rounded-lg
        transition
        duration-200
      ">
            Click Me
        </button>

        <!-- Input Example -->
        <input type="text" placeholder="Focus on me" class="
        border
        border-brown-300
        focus:border-blue-500
        focus:ring-2
        focus:ring-blue-300
        px-4 py-2
        rounded-md
        outline-none
      " />

    </div>

</body>

</html>
